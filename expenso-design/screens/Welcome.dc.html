<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#000000}a:hover{color:#1A1A1A}

<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 24px; background: #FFFFFF; color: #000000; font-family: Inter, system-ui, sans-serif;">
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 13px; font-weight: 500; color: #545454; text-transform: uppercase;">Welcome to Expenso</span>
    <h1 style="margin: 0; font-size: 32px; line-height: 40px; font-weight: 700;">Set up your monthly budget</h1>
    <p style="margin: 0; font-size: 15px; line-height: 22px; color: #545454;">Takes a minute. You can change it any time.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <label for="salary" style="font-size: 14px; font-weight: 500;">Monthly salary (take-home)</label>
    <div style="display: flex; align-items: center; height: 56px; padding: 0 16px; background: #F6F6F6;">
      <span style="font-size: 20px; font-weight: 700; color: #545454; margin-right: 6px;">₹</span>
      <input id="salary" inputmode="numeric" value="1,12,739" style="flex-grow: 1; border: 0; background: transparent; font: 700 20px Inter, system-ui, sans-serif; color: #000000; min-width: 0;">
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px;">
    <span style="font-size: 14px; font-weight: 500;">Budget items</span>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 16px; background: #F6F6F6;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <label for="daily" style="flex-grow: 1; font-size: 15px; font-weight: 500;">Daily expenses</label>
        <div style="display: flex; align-items: center; width: 120px; height: 44px; padding: 0 12px; box-sizing: border-box; background: #FFFFFF;">
          <span style="color: #545454; margin-right: 4px;">₹</span>
          <input id="daily" inputmode="numeric" value="10,000" style="width: 100%; border: 0; background: transparent; font: 500 15px Inter, system-ui, sans-serif; text-align: right;">
        </div>
      </div>
      <span style="font-size: 13px; line-height: 18px; color: #545454;">Always included · ₹333.33 a day in November</span>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px;">
      <label for="rent" style="flex-grow: 1; font-size: 15px;">Rent</label>
      <div style="display: flex; align-items: center; width: 120px; height: 44px; padding: 0 12px; box-sizing: border-box; background: #F6F6F6;">
        <span style="color: #545454; margin-right: 4px;">₹</span>
        <input id="rent" inputmode="numeric" value="16,000" style="width: 100%; border: 0; background: transparent; font: 500 15px Inter, system-ui, sans-serif; text-align: right;">
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px;">
      <label for="emi" style="flex-grow: 1; font-size: 15px;">EMI</label>
      <div style="display: flex; align-items: center; width: 120px; height: 44px; padding: 0 12px; box-sizing: border-box; background: #F6F6F6;">
        <span style="color: #545454; margin-right: 4px;">₹</span>
        <input id="emi" inputmode="numeric" value="8,108" style="width: 100%; border: 0; background: transparent; font: 500 15px Inter, system-ui, sans-serif; text-align: right;">
      </div>
    </div>
    <button type="button" style="align-self: flex-start; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: #EEEEEE; color: #000000; font: 500 14px Inter, system-ui, sans-serif; cursor: pointer;">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add item
    </button>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; justify-content: space-between; font-size: 14px; color: #545454;">
      <span>Total budgeted <strong style="color: #000000; font-weight: 700;">₹34,108</strong></span>
      <span>Planned savings <strong style="color: #276B45; font-weight: 700;">+₹78,631</strong></span>
    </div>
    <a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #000000; color: #FFFFFF; font-size: 16px; font-weight: 500; text-decoration: none;">Save and continue</a>
  </div>
</div>
